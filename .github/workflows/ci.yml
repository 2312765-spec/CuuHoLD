name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Không dùng script "lint" (có --fix) trong CI — CI phải BÁO LỖI khi code
      # chưa chạy lint cục bộ, không được tự sửa rồi báo xanh.
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - run: npm test

      - run: npm run build

  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx eslint "src/**/*.{ts,vue}"

      - run: npm test

      - run: npm run build
